---
layout: default
---
<article class="page">
  {% if page.title %}
    <header class="page-head">
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    </header>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
